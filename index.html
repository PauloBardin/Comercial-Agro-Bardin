.graf{position:fixed;right:-46vw;bottom:-24vh;height:50vh;width:auto;fill:var(--laranja);z-index:-2;pointer-events:none;opacity:.9;
  -webkit-mask-image:linear-gradient(100deg,transparent 0,#000 38%);mask-image:linear-gradient(100deg,transparent 0,#000 38%)}
@media (min-width:760px){.graf{right:-12vw;bottom:-22vh;height:110vh}}
.caixa{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;animation:entra .55s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
.logo{width:184px;height:auto}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sub{margin:8px 0 0;color:var(--mormaco);font-size:15px;font-weight:500;line-height:1.45}
form{width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}
label.rot{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mormaco)}
.campo{position:relative}
input[type=password],input[type=text]{width:100%;min-height:52px;padding:12px 52px 12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);
  color:#fff;font:inherit;font-size:17px;font-weight:600;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input::placeholder{color:rgba(255,255,255,.55);font-weight:500}
input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(250,74,46,.55)}
.olho{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--mormaco);cursor:pointer;display:grid;place-items:center}
.olho svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lembrar{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;color:#e3ebf1;cursor:pointer}
.lembrar input{width:22px;height:22px;accent-color:var(--laranja);margin:0}
button.entrar{min-height:52px;border:0;border-radius:12px;background:var(--laranja);color:#fff;font:inherit;font-size:17px;font-weight:800;letter-spacing:.01em;cursor:pointer;
  transition:background-color .2s var(--ease),transform .2s var(--ease)}
button.entrar:hover{background:var(--terra)}
button.entrar:active{transform:scale(.98)}
button.entrar[disabled]{opacity:.75;cursor:progress}
.msg{min-height:22px;margin:0;font-size:14px;font-weight:600;color:#ffd2c9;text-align:center}
.nota{margin:0;font-size:12.5px;line-height:1.5;color:rgba(186,207,219,.85);text-align:center;max-width:34ch}
.abrindo .caixa{opacity:.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  'use strict';
  var CHAVE_LS='agro-bardin-painel-chave';
  var CABECA='<script>try{var t=localStorage.getItem("ab_tema");document.documentElement.dataset.theme=(t==="dark"||t==="light")?t:"light";}catch(e){document.documentElement.dataset.theme="light";}<\/script><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icone-192.png"><link rel="apple-touch-icon" href="icone-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agro Bardin"><meta name="robots" content="noindex, nofollow">';
  var $=function(id){return document.getElementById(id)};
  var P=JSON.parse($('pacote').textContent);
  var b64=function(s){var t=atob(s),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;};
  var paraB64=function(u){var s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
  function ler(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function gravar(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function semSuporte(){
    $('sub').textContent='Este navegador não consegue abrir o relatório protegido. Atualize o navegador do celular ou abra o link no Chrome ou no Safari.';
  }
  if(!window.crypto||!crypto.subtle||!window.TextDecoder||(P.gz&&!window.DecompressionStream)){semSuporte();return;}
  if(/[?&]sair\b/.test(location.search)){gravar(CHAVE_LS,null); history.replaceState(null,'',location.pathname);}

  function derivar(senha){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.sal),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    });
  }
  function abrir(chave){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},chave,b64(P.dados)).then(function(buf){
      if(!P.gz) return buf;
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function mostrar(html){
    html=html.replace('<head>','<head>'+CABECA);
    document.open(); document.write(html); document.close();
  }
  function formulario(){
    $('form').hidden=false;
    var s=$('senha'); setTimeout(function(){try{s.focus()}catch(e){}},60);
  }
  $('olho').addEventListener('click',function(){
    var s=$('senha'), ver=s.type==='password'; s.type=ver?'text':'password';
    this.setAttribute('aria-pressed',ver); this.setAttribute('aria-label',ver?'Esconder senha':'Mostrar senha');
  });
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var senha=$('senha').value; if(!senha) return;
    var bt=$('entrar'), msg=$('msg'); bt.disabled=true; bt.textContent='Abrindo…'; msg.textContent='';
    var chave;
    derivar(senha).then(function(k){chave=k; return abrir(k);}).then(function(html){
      if($('lembrar').checked) return crypto.subtle.exportKey('raw',chave).then(function(raw){gravar(CHAVE_LS,P.id+':'+paraB64(new Uint8Array(raw))); return html;});
      return html;
    }).then(mostrar).catch(function(){
      bt.disabled=false; bt.textContent='Entrar'; msg.textContent='Senha incorreta. Confira e tente de novo.';
      $('senha').select();
    });
  });
  // aparelho que já entrou antes: abre direto com a chave guardada
  var guardada=ler(CHAVE_LS);
  if(guardada&&guardada.indexOf(P.id+':')===0){
    $('sub').textContent='Abrindo o relatório…'; document.body.classList.add('abrindo');
    crypto.subtle.importKey('raw',b64(guardada.slice(P.id.length+1)),{name:'AES-GCM'},false,['decrypt']).then(abrir).then(mostrar).catch(function(){
      gravar(CHAVE_LS,null); document.body.classList.remove('abrindo');
      $('sub').textContent='A senha da equipe mudou. Digite a nova senha para abrir o relatório.'; formulario();
    });
  } else formulario();
})();
</script>
